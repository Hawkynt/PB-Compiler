name: Stacked intrinsics validation

on:
  push:
    branches: [feature/intrinsics-zero-overhead]

permissions:
  contents: read

jobs:
  build-and-focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PB-Compiler.slnx
      - name: Apply known PR36 compile fixes in validation workspace
        shell: python
        run: |
          from pathlib import Path

          backend = Path('PowerBasic.Compiler/Runtime/SoftwareX87Backend.cs')
          text = backend.read_text()
          text = text.replace(
              'case "FWAIT" or "WAIT": return this.RequireNoOperands(operands, out error);',
              'case "FWAIT" or "WAIT": return RequireNoOperands(operands, out error);')
          backend.write_text(text)

          engine = Path('PowerBasic.Compiler/Runtime/SoftwareX87Engine.cs')
          text = engine.read_text()
          old = '\n'.join([
              '      (0xD8, >= 0xC0 and <= 0xF8) => this.EmitArithmeticStack(opcode, modRmBase, register.Index),',
              '      (0xDC, >= 0xC0 and <= 0xF8) => this.EmitArithmeticStack(opcode, modRmBase, register.Index),',
              '      (0xDE, 0xC0 or 0xC8 or 0xE0 or 0xE8 or 0xF0 or 0xF8) => this.EmitArithmeticPop(modRmBase, register.Index),',
              '      (0xD8, 0xD0) => this.EmitCompareStack(register.Index, popCount: 0, unordered: false),',
              '      (0xD8, 0xD8) => this.EmitCompareStack(register.Index, popCount: 1, unordered: false),'])
          new = '\n'.join([
              '      (0xD8, 0xD0) => this.EmitCompareStack(register.Index, popCount: 0, unordered: false),',
              '      (0xD8, 0xD8) => this.EmitCompareStack(register.Index, popCount: 1, unordered: false),',
              '      (0xD8, >= 0xC0 and <= 0xF8) => this.EmitArithmeticStack(opcode, modRmBase, register.Index),',
              '      (0xDC, >= 0xC0 and <= 0xF8) => this.EmitArithmeticStack(opcode, modRmBase, register.Index),',
              '      (0xDE, 0xC0 or 0xC8 or 0xE0 or 0xE8 or 0xF0 or 0xF8) => this.EmitArithmeticPop(modRmBase, register.Index),'])
          if old not in text:
              raise SystemExit('expected SoftwareX87Engine switch block not found')
          engine.write_text(text.replace(old, new))

          stack = Path('PowerBasic.Compiler/Runtime/SoftwareX87Engine.Stack.cs')
          text = stack.read_text()
          old = '(short exp, ushort meta, ushort w0, ushort w1, ushort w2, ushort w3) = mnemonic switch {'
          if old not in text:
              raise SystemExit('expected SoftwareX87Engine.Stack tuple declaration not found')
          stack.write_text(text.replace(old, 'var (exp, meta, w0, w1, w2, w3) = mnemonic switch {'))
      - name: Build
        run: dotnet build PB-Compiler.slnx --configuration Release --no-restore
      - name: Focused intrinsic and target tests
        run: >
          dotnet test PowerBasic.Compiler.Tests
          --configuration Release --no-build
          --filter "FullyQualifiedName~InlineAsmZeroOverheadTests|FullyQualifiedName~InlineAsmExtendedSimdSemanticTests|FullyQualifiedName~RuntimeTargetPolicyTests|FullyQualifiedName~AssemblerSsse3Sse4Tests"
