name: CI

on:
  pull_request:
    branches: [main, master]
  # release.yml calls this via `uses: ./.github/workflows/ci.yml` so tag
  # releases run the exact same test matrix as per-PR CI.
  workflow_call: {}
  workflow_dispatch: {}

# Pushing three times to a branch used to queue three full matrices and run all of them. A newer
# pull-request run supersedes the older one; a push to main is not cancelled, because main wants a
# recorded result for every commit rather than only for the newest.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  syntax-oracle:
    name: PB35 / PDS syntax oracle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PB-Compiler.slnx

      - name: Build
        run: dotnet build PB-Compiler.slnx --configuration Release --no-restore

      - name: Install DOSBox
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox
          echo "DOSBOX_EXE=$(command -v dosbox)" >> "$GITHUB_ENV"
          echo "SDL_VIDEODRIVER=dummy" >> "$GITHUB_ENV"

      # This is a separate required job so unrelated failures in the ordinary compiler suite cannot
      # silently skip the historical accept/reject contract. Every project statement form is fed to
      # genuine PBC 3.50 and BASIC PDS 7.0/7.1.
      - name: Exhaustive PB35 / PDS statement oracle
        env:
          PB_TOOLCHAIN_KEY: ${{ secrets.PB_TOOLCHAIN_KEY }}
          DIALECTS: pb35,pds70,pds71
          REQUIRE_ORACLES: pb35,pds70,pds71
        run: bash scripts/run-syntax-oracle-tests.sh

      - name: Upload syntax oracle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb35-pds-syntax-oracle
          path: build/conformance/syntax/oracle-results.tsv
          if-no-files-found: error

  test:
    name: ${{ matrix.os == 'ubuntu-latest' && 'Linux core' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                          # version.pl needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PB-Compiler.slnx

      - name: Build
        run: dotnet build PB-Compiler.slnx --configuration Release --no-restore

      - name: Verify release archive packaging
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/workflows/scripts/test-package-app-artifacts.sh

      # Classic DOSBox runs ordinary execution tests; DOSBox-X's Pentium-MMX
      # profile runs the packed-kernel oracle. Both are installed on Linux only.
      # The classic emulator's portable FPU computes in 64-bit doubles (the
      # GitHub runners offer no GLX visual for DOSBox Staging, which would use
      # the host's real 80-bit x87), so extended-precision assertions self-skip
      # under PBC_TEST_REDUCED_FPU.
      - name: Install DOSBox (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox dosbox-x
          echo "DOSBOX_EXE=$(command -v dosbox)" >> "$GITHUB_ENV"
          echo "DOSBOX_MMX_EXE=$(command -v dosbox-x)" >> "$GITHUB_ENV"
          echo "SDL_VIDEODRIVER=dummy" >> "$GITHUB_ENV"
          echo "PBC_TEST_REDUCED_FPU=1" >> "$GITHUB_ENV"

      # Core tier - REQUIRED: compiler unit tests + corpus gates + DOSBox
      # execution tests. DOSBox-dependent tests self-skip when their emulator
      # is unavailable, so this tier also runs on Windows.
      - name: Core tests
        run: >
          dotnet test PowerBasic.Compiler.Tests
          --configuration Release --no-build
          --filter "TestCategory!=Performance"
          --logger "trx;LogFileName=core-tests.trx"

      # Failures surface as check-run annotations so they are diagnosable
      # from the run summary without downloading artifacts.
      - name: Annotate failing tests
        if: failure()
        shell: python
        run: |
          import glob
          import xml.etree.ElementTree as ET
          ns = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          for f in glob.glob('**/*.trx', recursive=True):
              try:
                  tree = ET.parse(f)
              except Exception:
                  continue
              for r in tree.getroot().iter(ns + 'UnitTestResult'):
                  if r.get('outcome') != 'Failed':
                      continue
                  message = ''
                  m = r.find('.//' + ns + 'Message')
                  if m is not None and m.text:
                      message = ' '.join(m.text.split())[:600]
                  print(f"::error::FAILED {r.get('testName')}: {message}")

      - name: Verify differential diagnostic isolation
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/tests/diff-diagnostics-test.sh

      - name: Verify required-result gate
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/tests/ci-result-gate-test.sh

      # REQUIRED, DOSBox-free: every corpus program (pb35 + pb36 + all dialect
      # batteries) is emit-basic'd back to pb35 source and recompiled under the
      # pb35 dialect - proving the back-emitter always produces compile-clean,
      # PB 3.5-compatible output. Deterministic (no emulator/oracle), so it gates.
      - name: Round-trip back-emitter gate
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/roundtrip-check.sh

      # Advisory tier: the full golden-output battery through the pbc CLI and
      # headless DOSBox (compile every tests/*.BAS on the host, run the EXE in
      # the emulator, diff against tests/*.expected).
      - name: DOS golden battery
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true                   # advisory: emulator quirks must not block merges
        run: bash scripts/run-dos-tests.sh

      # Performance tier - advisory by definition (STANDARD.md: wall-clock
      # assertions never block a merge). TestCategory, not Category: the latter
      # narrows the REPORTING and still executes every fixture, which is how this
      # step used to re-run the whole suite behind continue-on-error.
      - name: Performance tests
        continue-on-error: true
        run: >
          dotnet test PowerBasic.Compiler.Tests
          --configuration Release --no-build
          --filter "TestCategory=Performance"
          --logger "trx;LogFileName=perf-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  # Independent execution prevents package installation, the full compiler
  # matrix and the vintage batteries from sharing a single 90-minute budget.
  oracle:
    name: DOS runtime oracle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install precise DOSBox
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x
          echo "SDL_VIDEODRIVER=dummy" >> "$GITHUB_ENV"

      # Keep the complete comparison command and its secret scope unchanged.
      # Classic DOSBox cannot verify MBF64/QUAD low bits or QB transcendentals.
      - name: Differential oracle battery
        env:
          PB_TOOLCHAIN_KEY: ${{ secrets.PB_TOOLCHAIN_KEY }}
        run: |
          oracleEmulator="$(command -v dosbox-x)"
          DOSBOX_EXE="$oracleEmulator" bash scripts/run-diff-tests.sh

      - name: Upload differential diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-oracle-diagnostics
          path: build/diff-failures/**
          if-no-files-found: ignore

  # Preserve the protected check name. A skipped or cancelled dependency must
  # never satisfy it; always() lets the guard report failure rather than skip.
  linux-required:
    name: ubuntu-latest
    needs: [test, oracle]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require complete core and oracle success
        env:
          CORE_RESULT: ${{ needs.test.result }}
          ORACLE_RESULT: ${{ needs.oracle.result }}
        run: bash scripts/require-ci-success.sh "$CORE_RESULT" "$ORACLE_RESULT"

  # A text lint over README.md against the house convention — no build, no toolchain — so it
  # runs beside the rest rather than inside it and cannot mask them.
  repo-readme:
    name: repo README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Hawkynt/RepositoryTemplate/repo-readme@v1
