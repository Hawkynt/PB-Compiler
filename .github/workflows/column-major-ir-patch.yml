name: Apply column-major IR patch

on:
  push:
    branches: [fix/powerbasic-column-major-arrays]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: arm guarded IR layout patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/powerbasic-column-major-arrays
          fetch-depth: 0

      - name: Apply exact-match patch
        run: python scripts/apply-column-major-ir-patch.py

      - name: Remove one-shot patch machinery
        run: git rm scripts/apply-column-major-ir-patch.py .github/workflows/column-major-ir-patch.yml

      - name: Commit routed layout correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PowerBasic.Compiler/Ir/IrLowering.cs
          git diff --cached --check
          git commit -m "fix: use PowerBASIC layout in IR lowering"
          git push origin HEAD:fix/powerbasic-column-major-arrays
