name: O0070 README sync

on:
  push:
    branches:
      - opt/o0070-ir-frame-elision

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opt/o0070-ir-frame-elision
          fetch-depth: 0

      - name: Update O0070 README entries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              Path("docs/optimizations/README.md"): (
                  "| ⬜ | [O0070](O0070-leaf-frame-elision.md) | Leaf-frame elision |",
                  "| 🟡 | [O0070](O0070-leaf-frame-elision.md) | Leaf-frame elision |",
              ),
              Path("README.md"): (
                  "| ⬜ | [O0070](docs/optimizations/O0070-leaf-frame-elision.md) | Leaf-frame elision | A procedure with no locals, strings or GOSUB skips the whole BP frame. |",
                  "| 🟡 | [O0070](docs/optimizations/O0070-leaf-frame-elision.md) | Leaf-frame elision | IR-routed procedures with no surviving fixed stack slots can omit the BP frame; 8086 stack-parameter cases still need BP. |",
              ),
          }

          for path, (old, new) in changes.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one O0070 row, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          Path(".github/workflows/o0070-readme-sync.yml").unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/optimizations/README.md .github/workflows/o0070-readme-sync.yml
          git commit -m "+ update O0070 optimization indexes"
          git push origin HEAD:opt/o0070-ir-frame-elision
