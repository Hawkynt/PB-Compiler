name: O0271 focused selector patch

on:
  push:
    branches:
      - o0271-backend-followup
    paths:
      - .github/workflows/o0271-self-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: o0271-backend-followup

      - name: Apply focused selector edits
        run: python .github/o0271_patch.py

      - name: Verify focused selector diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "PowerBasic.Compiler/Backend/InstructionSelector.cs"
          test "$(git diff -- PowerBasic.Compiler/Backend/InstructionSelector.cs | grep -c '^@@')" -eq 3

      - name: Commit selector patch and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PowerBasic.Compiler/Backend/InstructionSelector.cs
          git rm .github/o0271_patch.py .github/workflows/o0271-self-patch.yml
          git diff --cached --check
          git commit -m "Support O0271 indirect calls in x86 selector"
          git push origin HEAD:o0271-backend-followup
