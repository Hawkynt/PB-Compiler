name: PR52 apply CPU normalization v5

on:
  push:
    branches:
      - feature/intrinsic-zero-overhead-optimization

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply and validate normalized CPU targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          base_workflow = Path('.github/workflows/pr52-apply-cpu-normalization.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(base_workflow) if line == '        run: |') + 1
          body = []
          for line in base_workflow[start:]:
              if line and not line.startswith('          '):
                  break
              body.append(line[10:] if line.startswith('          ') else '')
          script = '\n'.join(body) + '\n'
          restore = 'dotnet restore PB-Compiler.slnx'
          if restore not in script:
              raise SystemExit('restore anchor changed')
          Path('/tmp/apply-cpu-normalization.sh').write_text(
              script.replace(restore, 'python /tmp/pr52-normalization-preflight.py\n' + restore, 1))

          v4 = Path('.github/workflows/pr52-apply-cpu-normalization-v4.yml').read_text()
          match = re.search(r"echo '([^']+)' \\| base64 -d > /tmp/pr52-normalization-preflight.py", v4)
          if match is None:
              raise SystemExit('v4 payload anchor changed')
          preflight = base64.b64decode(match.group(1)).decode()
          broken = "''''    this._rt.EnableFastVideo"
          fixed = "'''    this._rt.EnableFastVideo"
          if preflight.count(broken) != 1:
              raise SystemExit(f'expected one malformed delimiter, found {preflight.count(broken)}')
          Path('/tmp/pr52-normalization-preflight.py').write_text(preflight.replace(broken, fixed))
          PY
          python -m py_compile /tmp/pr52-normalization-preflight.py
          bash /tmp/apply-cpu-normalization.sh
