name: PR52 apply CPU normalization v6

on:
  push:
    branches:
      - feature/intrinsic-zero-overhead-optimization

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply and validate normalized CPU targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr52-apply-cpu-normalization-v3.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line == '        run: |') + 1
          body = []
          for line in source[start:]:
              if line and not line.startswith('          '):
                  break
              body.append(line[10:] if line.startswith('          ') else '')

          script = '\n'.join(body) + '\n'
          anchor = 'python /tmp/fix-inline-shift-test.py\n'
          if script.count(anchor) != 1:
              raise SystemExit(f'v3 profitability insertion anchor count: {script.count(anchor)}')
          Path('/tmp/apply-cpu-normalization-v6.sh').write_text(
              script.replace(anchor, anchor + 'python /tmp/fix-runtime-profitability.py\n', 1))
          PY
          cat > /tmp/fix-runtime-profitability.py <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              file.write_text(text.replace(old, new))

          replace(
              'PowerBasic.Compiler/Runtime/DosRuntime.Targeting.cs',
              '  public RuntimeTarget Target {\n'
              '    get => this._target;\n'
              '    set => this._target = value;\n'
              '  }\n\n',
              '  public RuntimeTarget Target {\n'
              '    get => this._target;\n'
              '    set => this._target = value;\n'
              '  }\n\n'
              '  /// <summary>\n'
              '  /// Enables optimizer-selected widened/vector bulk runtime kernels. <see cref="Target"/> remains the\n'
              '  /// unconditional legality contract used by runtime state setup and inline assembly; this switch only\n'
              '  /// controls whether equivalent but larger/faster bulk implementations are worth emitting.\n'
              '  /// </summary>\n'
              '  public bool EnableTargetOptimizations { get; set; }\n\n')

          replace(
              'PowerBasic.Compiler/Runtime/DosRuntime.Targeting.cs',
              '  private void EmitVectorCopyPrefix(Assembler asm) {\n'
              '    var width = this.Target.MaxRuntimeBulkVectorWidthBytes;\n',
              '  private void EmitVectorCopyPrefix(Assembler asm) {\n'
              '    if (!this.EnableTargetOptimizations)\n'
              '      return;\n'
              '    var width = this.Target.MaxRuntimeBulkVectorWidthBytes;\n')

          replace(
              'PowerBasic.Compiler/Runtime/DosRuntime.Targeting.cs',
              '  private void EmitVectorZeroPrefix(Assembler asm, int unitBytes) {\n'
              '    var width = this.Target.MaxRuntimeBulkVectorWidthBytes;\n',
              '  private void EmitVectorZeroPrefix(Assembler asm, int unitBytes) {\n'
              '    if (!this.EnableTargetOptimizations)\n'
              '      return;\n'
              '    var width = this.Target.MaxRuntimeBulkVectorWidthBytes;\n')

          replace(
              'PowerBasic.Compiler/Runtime/DosRuntime.Targeting.cs',
              '    if (!this.Target.Has32BitGeneralPurpose) {\n'
              '      asm.Xor(Reg.AL, Reg.AL);',
              '    if (!this.EnableTargetOptimizations || !this.Target.Has32BitGeneralPurpose) {\n'
              '      asm.Xor(Reg.AL, Reg.AL);')

          replace(
              'PowerBasic.Compiler/Runtime/DosRuntime.Core.cs',
              '    if (!this.Target.Has32BitGeneralPurpose) {\n'
              '      asm.Rep();\n'
              '      asm.Movsb();',
              '    if (!this.EnableTargetOptimizations || !this.Target.Has32BitGeneralPurpose) {\n'
              '      asm.Rep();\n'
              '      asm.Movsb();')

          replace(
              'PowerBasic.Compiler/Runtime/DosRuntime.Core.cs',
              '    if (!this.Target.Has32BitGeneralPurpose) {\n'
              '      asm.Xor(Reg.AX, Reg.AX);',
              '    if (!this.EnableTargetOptimizations || !this.Target.Has32BitGeneralPurpose) {\n'
              '      asm.Xor(Reg.AX, Reg.AX);')

          replace(
              'PowerBasic.Compiler/CodeGen/CodeGenerator.cs',
              '    this._rt.EnableFastVideo = model.FastVideo;   // R1: $OPTION VIDEO direct-video console PRINT\n'
              '    this._rt.Target = this.RuntimeTargetForRuntime();\n',
              '    this._rt.EnableFastVideo = model.FastVideo;   // R1: $OPTION VIDEO direct-video console PRINT\n'
              '    this._rt.EnableTargetOptimizations = this.Optimize;\n'
              '    this._rt.Target = this.RuntimeTargetForRuntime();\n')
          PY
          python -m py_compile /tmp/fix-runtime-profitability.py
          bash /tmp/apply-cpu-normalization-v6.sh
