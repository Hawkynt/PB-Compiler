name: PR52 CPU backend patch

on:
  push:
    branches:
      - feature/intrinsic-zero-overhead-optimization

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != '+ Apply CPU generation backend matrix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused target-generation patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          payloads = {
            'PowerBasic.Compiler/Backend/SelectionTarget.cs': '',
            'PowerBasic.Compiler.Tests/CodeGen/InlineAsm8086ShiftTests.cs': '',
            'PowerBasic.Compiler.Tests/Backend/BackendCpuTargetTests.cs': '',
            '.github/workflows/pr52-validation.yml': ''
          }
          for path, encoded in payloads.items():
              Path(path).write_bytes(base64.b64decode(encoded))

          p = Path('PowerBasic.Compiler/CodeGen/CodeGenerator.Backend.cs')
          text = p.read_text()
          old = '  private Backend.SelectionTarget SelectionTarget => new(\n    Cpu386: this._rt.Cpu386, Optimize: this.Optimize,\n    OptimizeSpeed: this.OptimizeSpeed, OptimizeSize: this.OptimizeSize,\n    Cost: this.SelectionCost);'
          new = '  private Backend.SelectionTarget SelectionTarget => new(\n    Cpu386: this._rt.Cpu386, Optimize: this.Optimize,\n    OptimizeSpeed: this.OptimizeSpeed, OptimizeSize: this.OptimizeSize,\n    Cost: this.SelectionCost, CpuLevel: this._rt.Target.CpuLevel);'
          if text.count(old) != 1:
              raise SystemExit(f'CodeGenerator.Backend target anchor count = {text.count(old)}')
          p.write_text(text.replace(old, new))

          p = Path('PowerBasic.Compiler/Backend/InstructionSelector.cs')
          text = p.read_text().replace('this._target.Cpu386', 'this._target.Cpu386OrLater').replace('Cpu386: true', 'Cpu386OrLater: true')
          old = 'if (count == 1 || this._target.Cpu386OrLater) {'
          if text.count(old) != 1:
              raise SystemExit(f'InstructionSelector shift anchor count = {text.count(old)}')
          p.write_text(text.replace(old, 'if (count == 1 || this._target.Cpu186OrLater) {'))

          p = Path('PowerBasic.Compiler.Tests/Exec/Cpu8086.cs')
          text = p.read_text()
          old_loop = 'for (var i = 0; i < (count & 0x1F); ++i)'
          old_flags = 'if ((count & 0x1F) != 0 && op >= 4) {'
          if text.count(old_loop) != 2 or text.count(old_flags) != 2:
              raise SystemExit(f'Cpu8086 shift anchors loops={text.count(old_loop)} flags={text.count(old_flags)}')
          p.write_text(text.replace(old_loop, 'for (var i = 0; i < count; ++i)').replace(old_flags, 'if (count != 0 && op >= 4) {'))
          PY

          git config user.name Hawkynt
          git config user.email github@synthelicz.de
          git add -A
          git diff --cached --check
          git commit -m '+ Apply CPU generation backend matrix'
          git push origin HEAD:${GITHUB_REF_NAME}
