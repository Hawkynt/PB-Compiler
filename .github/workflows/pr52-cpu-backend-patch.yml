name: PR52 Cpu386 audit

on:
  push:
    branches:
      - feature/intrinsic-zero-overhead-optimization

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List legacy CPU generation gates
        shell: bash
        run: |
          echo '--- exact Cpu386 identifiers ---'
          rg -n '\bCpu386\b' PowerBasic.Compiler PowerBasic.Compiler.Tests docs || true
          echo '--- lowercase cpu386 identifiers ---'
          rg -n '\bcpu386\b' PowerBasic.Compiler PowerBasic.Compiler.Tests docs || true
