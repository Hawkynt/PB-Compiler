name: PR52 finish CPU generation targeting

on:
  push:
    branches:
      - feature/intrinsic-zero-overhead-optimization

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Normalize remaining generation decisions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              p.write_text(text.replace(old, new))

          def sub(path, pattern, replacement, count=1):
              p = Path(path)
              text = p.read_text()
              text, actual = re.subn(pattern, replacement, text, count=count, flags=re.S)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} regex replacements, found {actual}: {pattern!r}')
              p.write_text(text)

          replace(
              'PowerBasic.Compiler/CodeGen/CodeGenerator.RuntimeTarget.cs',
              'public sealed partial class CodeGenerator {\n  private RuntimeIsaPolicy? _runtimeIsaPolicy;\n',
              'public sealed partial class CodeGenerator {\n  private RuntimeTarget? _runtimeTarget;\n  private RuntimeIsaPolicy? _runtimeIsaPolicy;\n')
          replace(
              'PowerBasic.Compiler/CodeGen/CodeGenerator.RuntimeTarget.cs',
              '  private RuntimeTarget RuntimeTargetForRuntime() {\n    var cpu = model.MetaStatements.FirstOrDefault(m =>\n',
              '  private RuntimeTarget RuntimeTargetForRuntime() {\n    if (this._runtimeTarget is { } cached)\n      return cached;\n\n    var cpu = model.MetaStatements.FirstOrDefault(m =>\n')
          replace(
              'PowerBasic.Compiler/CodeGen/CodeGenerator.RuntimeTarget.cs',
              '    return target;\n  }\n\n  /// <summary>\n  /// Parses target-behaviour directives once.',
              '    return this._runtimeTarget = target;\n  }\n\n  /// <summary>\n  /// Parses target-behaviour directives once.')

          replace(
              'PowerBasic.Compiler/CodeGen/CodeGenerator.Optimize.cs',
              '  /// <summary>True when $CPU 80486 selected - C2 alignment and 486-only opcodes (BSWAP) become legal.</summary>\n  private bool Cpu486 => model.MetaStatements.Any(m =>\n    m.Command.Equals("CPU", StringComparison.OrdinalIgnoreCase)\n    && m.Arguments is [{ } level, ..]\n    && level.Text is "80486" or "486");\n',
              '  /// <summary>Exact 80486 tuning profile for procedure-entry alignment. This is deliberately not a capability test: later cores can execute 486 instructions, but may have different layout tuning.</summary>\n  private bool Is486TuningTarget => this.CpuLevel == 486;\n')
          sub(
              'PowerBasic.Compiler/CodeGen/CodeGenerator.Optimize.cs',
              r'  /// <summary>True when \$CPU 80586/Pentium \(or higher\) is selected - the floor for the SIMD feature flags\.</summary>\n  private bool Cpu586 => model\.MetaStatements\.Any\(m =>\n    m\.Command\.Equals\("CPU", StringComparison\.OrdinalIgnoreCase\)\n    && m\.Arguments is \[\{ \} level, \.\.\]\n    && level\.Text is "80586" or "586" or "PENTIUM"\);\n\n',
              '')
          sub(
              'PowerBasic.Compiler/CodeGen/CodeGenerator.Optimize.cs',
              r'  /// <summary>\n  /// True when a <c>\$CPU 80586 &lt;feature&gt; \.\.\.</c> metastatement requests the named SIMD\n  /// extension \(MMX / SSE / SSE2 / AVX / AVX512 / AES\)\. Auto-vectorisation emits the widest\n  /// requested width and falls back to a narrower one \(or scalar\) otherwise\. Off-by-default, so\n  /// no existing program emits SIMD; genuine PBC 3\.50 predates these, so they are not oracle-tested\.\n  /// </summary>\n  private bool CpuFeature\(string name\) => model\.MetaStatements\.Any\(m =>\n    m\.Command\.Equals\("CPU", StringComparison\.OrdinalIgnoreCase\)\n    && m\.Arguments\.Skip\(1\)\.Any\(t => t\.Text\.Equals\(name, StringComparison\.OrdinalIgnoreCase\)\)\);\n\n  private bool HasMmx => this\.Cpu586 && this\.CpuFeature\("MMX"\);\n\n  /// <summary>True when SSE2 \(128-bit XMM packed integer\) is requested - 8 INTEGER lanes per vector\. SSE implies SSE2 here for the integer path\.</summary>\n  private bool HasSse2 => this\.Cpu586 && \(this\.CpuFeature\("SSE2"\) \|\| this\.CpuFeature\("SSE"\)\);\n\n  /// <summary>True when AVX2 \(256-bit YMM packed integer\) is requested - 16 INTEGER lanes\. AVX implies AVX2 here for the integer path\.</summary>\n  private bool HasAvx2 => this\.Cpu586 && \(this\.CpuFeature\("AVX2"\) \|\| this\.CpuFeature\("AVX"\)\);\n\n  /// <summary>True when AVX-512 \(512-bit ZMM packed integer\) is requested - 32 INTEGER lanes\.</summary>\n  private bool HasAvx512 => this\.Cpu586 && \(this\.CpuFeature\("AVX512"\) \|\| this\.CpuFeature\("AVX-512"\)\);\n',
              '  /// <summary>SIMD capability queries come from the same normalized target used by runtime and inline-assembly validation. In particular SSE1 does not invent SSE2, and AVX does not invent AVX2.</summary>\n  private bool HasMmx => this.RuntimeTargetForRuntime().HasMmx;\n  private bool HasSse2 => this.RuntimeTargetForRuntime().HasSse2;\n  private bool HasAvx2 => this.RuntimeTargetForRuntime().HasAvx2;\n  private bool HasAvx512 => this.RuntimeTargetForRuntime().HasAvx512;\n')

          replace('PowerBasic.Compiler/CodeGen/CodeGenerator.Procs.cs', 'this.Cpu486', 'this.Is486TuningTarget')
          replace('PowerBasic.Compiler/CodeGen/CodeGenerator.Backend.cs', 'this.Cpu486', 'this.Is486TuningTarget')
          replace('PowerBasic.Compiler/CodeGen/CodeGenerator.Backend.cs', 'Cost: this.SelectionCost, CpuLevel: this._rt.Target.CpuLevel);', 'Cost: this.SelectionCost, CpuLevel: this.CpuLevel);')
          replace(
              'PowerBasic.Compiler/CodeGen/CodeGenerator.Units.cs',
              '    if (this.Cpu486)\n      flags |= PbuCpuFlags.Needs386; // 486 still requires (at least) a 386\n',
              '')

          # Feature-only targets and real ISA prerequisites: SSE1 != SSE2, AVX != AVX2.
          p = Path('PowerBasic.Compiler.Tests/CodeGen/AutoVectorizeTests.cs')
          text = p.read_text()
          anchor = '''  [Test]\n  public void Compile_GivenMultiplyLoop_ThenEmitsPmullw() {'''
          insert = '''  [Test]\n  public void Compile_GivenFeatureOnlySse2Target_ThenEmitsXmmPaddw() {\n    var image = Compile("$CPU SSE2\\n$OPTIMIZE SPEED\\n" + _ADD_LOOP);\n    Assert.That(Count(image, 0x66, 0x0F, 0xFD), Is.GreaterThan(0),\n      "a feature-only target is normalized exactly like an explicit generation plus SSE2");\n  }\n\n  [Test]\n  public void Compile_GivenSse1WithoutSse2_ThenDoesNotInventPackedIntegerXmm() {\n    var image = Compile("$CPU SSE\\n$OPTIMIZE SPEED\\n" + _ADD_LOOP);\n    Assert.That(Count(image, 0x66, 0x0F, 0xFD), Is.EqualTo(0),\n      "SSE1 has XMM registers but not SSE2 packed-integer PADDW");\n  }\n\n  [Test]\n  public void Compile_GivenAvxWithoutAvx2_ThenFallsBackToSse2IntegerWidth() {\n    var image = Compile("$CPU AVX\\n$OPTIMIZE SPEED\\n" + _ADD_LOOP);\n    Assert.Multiple(() => {\n      Assert.That(Count(image, 0x66, 0x0F, 0xFD), Is.GreaterThan(0),\n        "AVX hardware also satisfies the real SSE2 prerequisite");\n      Assert.That(Count(image, 0xC5, 0xFD, 0xFD), Is.EqualTo(0),\n        "AVX must not be treated as AVX2 for packed integer operations");\n    });\n  }\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('AutoVectorizeTests insertion anchor changed')
          p.write_text(text.replace(anchor, insert + anchor))

          p = Path('PowerBasic.Compiler.Tests/Runtime/RuntimeTargetFeatureTests.cs')
          text = p.read_text()
          anchor = '''  [Test]\n  public void CpuFloors_AreCumulative() {'''
          insert = '''  [TestCase("8086", 86)]\n  [TestCase("186", 186)]\n  [TestCase("286", 286)]\n  [TestCase("386", 386)]\n  [TestCase("486", 486)]\n  [TestCase("586", 586)]\n  [TestCase("686", 686)]\n  public void CpuLevelSpellings_NormalizeEverySupportedGeneration(string spelling, int expected)\n    => Assert.That(RuntimeTarget.For(spelling).CpuLevel, Is.EqualTo(expected));\n\n  [Test]\n  public void FeatureOnlyTarget_InfersItsMinimumCoreWithoutLosingTheFeature() {\n    var target = RuntimeTarget.For("SSE2");\n    Assert.Multiple(() => {\n      Assert.That(target.CpuLevel, Is.GreaterThanOrEqualTo(686));\n      Assert.That(target.HasSse2, Is.True);\n      Assert.That(target.Has32BitGeneralPurpose, Is.True);\n    });\n  }\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('RuntimeTargetFeatureTests insertion anchor changed')
          p.write_text(text.replace(anchor, insert + anchor))

          matrix = ''
          Path('PowerBasic.Compiler.Tests/Backend/BackendCpuGenerationMatrixTests.cs').write_bytes(base64.b64decode(matrix))

          # Keep exact-486 procedure alignment as a tuning policy, but remove stale implementation names from docs.
          p = Path('docs/PB36.md')
          text = p.read_text().replace('(`Cpu586`) and the SIMD extensions', '(the normalized runtime target) and the SIMD extensions')
          p.write_text(text)
          p = Path('docs/optimizations/O0026-auto-vectorization.md')
          text = p.read_text().replace('# O0026 — Auto-vectorization (MMX / SSE2 / AVX / AVX-512)', '# O0026 — Auto-vectorization (MMX / SSE2 / AVX2 / AVX-512)')
          p.write_text(text)

          # The two migration runners are disposable. This finishing runner deletes itself in the commit too.
          for path in [
              '.github/workflows/pr52-cpu-backend-patch.yml',
              '.github/workflows/pr52-remove-cpu386.yml',
              '.github/workflows/pr52-finish-cpu-generation.yml',
          ]:
              Path(path).unlink(missing_ok=True)

          # Mechanical guard: no generation boolean or pre-runtime target state may drive capability decisions now.
          guards = {
              'PowerBasic.Compiler/CodeGen/CodeGenerator.Optimize.cs': [r'\bCpu486\b', r'\bCpu586\b', r'CpuFeature\('],
              'PowerBasic.Compiler/CodeGen/CodeGenerator.Backend.cs': [r'_rt\.Target\.CpuLevel'],
              'PowerBasic.Compiler/CodeGen/CodeGenerator.Units.cs': [r'\bCpu486\b'],
          }
          for path, patterns in guards.items():
              data = Path(path).read_text()
              for pattern in patterns:
                  if re.search(pattern, data):
                      raise SystemExit(f'{path}: stale target decision remains: {pattern}')
          PY

          dotnet restore PB-Compiler.slnx
          dotnet build PB-Compiler.slnx --configuration Release --no-restore
          dotnet test PowerBasic.Compiler.Tests --configuration Release --no-build --filter "FullyQualifiedName~BackendCpuGenerationMatrixTests|FullyQualifiedName~AutoVectorizeTests|FullyQualifiedName~RuntimeTargetFeatureTests|FullyQualifiedName~LoopAlignmentTests|FullyQualifiedName~TargetCostTests|FullyQualifiedName~BackendCpuTargetTests|FullyQualifiedName~BackendResidencyTests|FullyQualifiedName~BackendWideIntegerTests|FullyQualifiedName~BackendQuadPrintTests|FullyQualifiedName~InlineAsm8086ShiftTests"
          dotnet test PowerBasic.Compiler.Tests --configuration Release --no-build --filter "Category!=Performance"
          git diff --check
          git status --short
          git config user.name Hawkynt
          git config user.email github@synthelicz.de
          git add -A
          git commit -m '+ Normalize CPU generation and ISA feature targeting'
          git push origin HEAD:${GITHUB_REF_NAME}
