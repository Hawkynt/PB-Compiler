name: PR52 fix finishing runner

on:
  push:
    branches:
      - feature/intrinsic-zero-overhead-optimization

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct nullable cache return
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pr52-finish-cpu-generation.yml')
          text = p.read_text()
          old = "              '    return this._runtimeTarget = target;\\n  }\\n\\n  /// <summary>\\n  /// Parses target-behaviour directives once.')"
          new = "              '    this._runtimeTarget = target;\\n    return target;\\n  }\\n\\n  /// <summary>\\n  /// Parses target-behaviour directives once.')"
          if old in text:
              text = text.replace(old, new, 1)
          cleanup_anchor = "              '.github/workflows/pr52-finish-cpu-generation.yml',\n"
          cleanup = cleanup_anchor + "              '.github/workflows/pr52-fix-finish.yml',\n"
          if "'.github/workflows/pr52-fix-finish.yml'" not in text:
              if cleanup_anchor not in text:
                  raise SystemExit('cleanup anchor changed')
              text = text.replace(cleanup_anchor, cleanup, 1)
          p.write_text(text)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name Hawkynt
          git config user.email github@synthelicz.de
          git add .github/workflows/pr52-finish-cpu-generation.yml
          git commit -m '+ Fix target-normalization runner cache return'
          git push origin HEAD:${GITHUB_REF_NAME}
