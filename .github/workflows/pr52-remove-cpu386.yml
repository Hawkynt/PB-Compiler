name: PR52 remove legacy Cpu386

on:
  push:
    branches:
      - feature/intrinsic-zero-overhead-optimization

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != '+ Remove legacy Cpu386 target gates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Remove legacy generation boolean
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          payload = ''
          Path('PowerBasic.Compiler/Backend/SelectionTarget.cs').write_bytes(base64.b64decode(payload))

          def change(path, fn):
              p = Path(path)
              old = p.read_text()
              new = fn(old)
              if new == old:
                  raise SystemExit(f'{path}: no change')
              p.write_text(new)

          change('PowerBasic.Compiler/Backend/InstructionSelector.cs', lambda t: t.replace('public static MFunction? TrySelect(IrFunction fn, bool cpu386 = false)\n    => TrySelect(fn, out _, new SelectionTarget(Cpu386: cpu386));', 'public static MFunction? TrySelect(IrFunction fn)\n    => TrySelect(fn, out _, SelectionTarget.Baseline);').replace('public static MFunction? TrySelect(IrFunction fn, out string? declineReason, bool cpu386 = false)\n    => TrySelect(fn, out declineReason, new SelectionTarget(Cpu386: cpu386));', 'public static MFunction? TrySelect(IrFunction fn, out string? declineReason)\n    => TrySelect(fn, out declineReason, SelectionTarget.Baseline);').replace('Cpu386: true', 'Cpu386OrLater: true').replace('bool cpu386)', 'bool use386Instructions)').replace('cpu386 ?', 'use386Instructions ?'))
          change('PowerBasic.Compiler/Backend/LinearScanAllocator.cs', lambda t: t.replace('target.Cpu386 &&', 'target.Cpu386OrLater &&'))
          change('PowerBasic.Compiler/Backend/InstructionSelector.Dispatch.cs', lambda t: t.replace('!this._target.Cpu386)', '!this._target.Cpu386OrLater)'))
          change('PowerBasic.Compiler/CodeGen/CodeGenerator.Backend.cs', lambda t: t.replace('    Cpu386: this._rt.Cpu386, Optimize: this.Optimize,\n', '    Optimize: this.Optimize,\n'))
          change('PowerBasic.Compiler/CodeGen/CodeGenerator.Intrinsics.cs', lambda t: t.replace('this._rt.Cpu386', 'this._rt.Target.Has32BitGeneralPurpose'))

          for path in ['PowerBasic.Compiler/CodeGen/CodeGenerator.Arrays.cs','PowerBasic.Compiler/CodeGen/CodeGenerator.Places.cs','PowerBasic.Compiler/CodeGen/CodeGenerator.Units.cs','PowerBasic.Compiler/CodeGen/CodeGenerator.Expressions.cs','PowerBasic.Compiler/CodeGen/CodeGenerator.LowLevel.cs','PowerBasic.Compiler/CodeGen/CodeGenerator.cs','PowerBasic.Compiler/CodeGen/CodeGenerator.Optimize.cs']:
              p = Path(path)
              p.write_text(p.read_text().replace('this.Cpu386', 'this.Has32BitCpu'))

          p = Path('PowerBasic.Compiler/CodeGen/CodeGenerator.Optimize.cs')
          text = p.read_text()
          text, n = re.subn(r'  /// <summary>True when \$CPU 80386.*?  private bool Cpu386 =>.*?\n\n', '  /// <summary>The normalized integer-core generation selected by $CPU.</summary>\n  private int CpuLevel => this.RuntimeTargetForRuntime().CpuLevel;\n\n  /// <summary>True when 32-bit general-purpose instructions are legal.</summary>\n  private bool Has32BitCpu => this.CpuLevel >= 386;\n\n', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'CodeGenerator.Optimize generation block: {n}')
          text = text.replace('TargetCost.For(this.Has32BitCpu, this.Cpu486, this.Cpu586, this.OptimizeSpeed, this.OptimizeSize)', 'TargetCost.For(this.CpuLevel, this.OptimizeSpeed, this.OptimizeSize)')
          p.write_text(text)

          change('PowerBasic.Compiler/CodeGen/CodeGenerator.cs', lambda t: t.replace('this._rt.Cpu386 = this.Optimize && this.Has32BitCpu;', 'this._rt.Target = this.RuntimeTargetForRuntime();'))
          change('PowerBasic.Compiler/Runtime/DosRuntime.Targeting.cs', lambda t: t.replace('    set {\n      this._target = value;\n      this.Cpu386 = value.Has32BitGeneralPurpose;\n    }', '    set => this._target = value;'))
          change('PowerBasic.Compiler/Runtime/DosRuntime.Core.cs', lambda t: t.replace('  /// <summary>Legacy compatibility gate. New runtime code should query <see cref="Target"/>.</summary>\n  public bool Cpu386 { get; set; }\n\n', ''))
          change('PowerBasic.Compiler/Runtime/DosRuntime.Math.cs', lambda t: t.replace('old exact-string Cpu386 test', 'old exact-string 386-generation test'))

          p = Path('PowerBasic.Compiler/CodeGen/TargetCost.cs')
          text = p.read_text()
          pattern = re.compile(r'  public static TargetCost For\(bool cpu386, bool cpu486, bool cpu586, bool optimizeSpeed, bool optimizeSize\) \{\n    var tier =\n      cpu586 \? CpuTier\.Pentium :\n      cpu486 \? CpuTier\.I80486 :\n      cpu386 \? CpuTier\.I80386 :\n      CpuTier\.I8086;')
          text, n = pattern.subn('  public static TargetCost For(int cpuLevel, bool optimizeSpeed, bool optimizeSize) {\n    var tier = cpuLevel switch {\n      >= 686 => CpuTier.P6,\n      >= 586 => CpuTier.Pentium,\n      >= 486 => CpuTier.I80486,\n      >= 386 => CpuTier.I80386,\n      >= 286 => CpuTier.I80286,\n      _ => CpuTier.I8086,\n    };', text, count=1)
          if n != 1:
              raise SystemExit(f'TargetCost.For: {n}')
          p.write_text(text)

          p = Path('PowerBasic.Compiler.Tests/CodeGen/TargetCostTests.cs')
          text = p.read_text()
          pairs = [('TargetCost.For(false, false, false, false, false)','TargetCost.For(86, false, false)'),('TargetCost.For(true, false, false, false, false)','TargetCost.For(386, false, false)'),('TargetCost.For(true, true, false, false, false)','TargetCost.For(486, false, false)'),('TargetCost.For(true, true, true, false, false)','TargetCost.For(586, false, false)'),('TargetCost.For(false, false, false, true, false)','TargetCost.For(86, true, false)'),('TargetCost.For(false, false, false, false, true)','TargetCost.For(86, false, true)')]
          for old, new in pairs:
              text = text.replace(old, new)
          text = text.replace('Assert.That(TargetCost.For(386, false, false).Tier, Is.EqualTo(CpuTier.I80386));', 'Assert.That(TargetCost.For(286, false, false).Tier, Is.EqualTo(CpuTier.I80286));\n      Assert.That(TargetCost.For(386, false, false).Tier, Is.EqualTo(CpuTier.I80386));')
          text = text.replace('Assert.That(TargetCost.For(586, false, false).Tier, Is.EqualTo(CpuTier.Pentium));', 'Assert.That(TargetCost.For(586, false, false).Tier, Is.EqualTo(CpuTier.Pentium));\n      Assert.That(TargetCost.For(686, false, false).Tier, Is.EqualTo(CpuTier.P6));')
          p.write_text(text)

          for path in ['PowerBasic.Compiler.Tests/Backend/BackendResidencyTests.cs','PowerBasic.Compiler.Tests/Backend/BackendCpuTargetTests.cs','PowerBasic.Compiler.Tests/Backend/BackendWideIntegerTests.cs','PowerBasic.Compiler.Tests/Backend/BackendQuadPrintTests.cs']:
              p = Path(path)
              text = p.read_text().replace('Cpu386: true', 'CpuLevel: 386').replace('Cpu386: false', 'CpuLevel: 86').replace('bool cpu386', 'bool target386').replace('Cpu386: cpu386', 'CpuLevel: target386 ? 386 : 86')
              p.write_text(text)

          change('docs/X86-BACKEND.md', lambda t: t.replace('bare `cpu386` flag', 'bare generation boolean'))
          offenders = []
          for root in ['PowerBasic.Compiler','PowerBasic.Compiler.Tests','docs']:
              for path in Path(root).rglob('*'):
                  if path.is_file() and path.suffix in {'.cs','.md'} and re.search(r'\bCpu386\b|\bcpu386\b', path.read_text(errors='ignore')):
                      offenders.append(str(path))
          if offenders:
              raise SystemExit('legacy identifiers remain: ' + ', '.join(offenders))
          PY
          dotnet restore PB-Compiler.slnx
          dotnet build PB-Compiler.slnx --configuration Release --no-restore
          dotnet test PowerBasic.Compiler.Tests --configuration Release --no-build --filter "FullyQualifiedName~BackendCpuTargetTests|FullyQualifiedName~BackendResidencyTests|FullyQualifiedName~BackendWideIntegerTests|FullyQualifiedName~BackendQuadPrintTests|FullyQualifiedName~TargetCostTests"
          git diff --check
          git config user.name Hawkynt
          git config user.email github@synthelicz.de
          git add PowerBasic.Compiler PowerBasic.Compiler.Tests docs
          git commit -m '+ Remove legacy Cpu386 target gates'
          git push origin HEAD:${GITHUB_REF_NAME}
