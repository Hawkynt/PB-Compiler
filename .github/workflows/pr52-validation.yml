name: PR52 validation

on:
  push:
    branches:
      - feature/intrinsic-zero-overhead-optimization

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PB-Compiler.slnx
      - name: Build
        run: dotnet build PB-Compiler.slnx --configuration Release --no-restore
      - name: ISA slice
        run: dotnet test PowerBasic.Compiler.Tests --configuration Release --no-build --filter "FullyQualifiedName~InlineAsmCryptoSemanticTests|FullyQualifiedName~AssemblerCryptoExtensionsTests|FullyQualifiedName~InlineAsmGp32SemanticTests|FullyQualifiedName~InlineAsmPopcnt"
