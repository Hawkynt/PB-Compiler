name: runtime-target-bootstrap

on:
  push:
    branches:
      - feature/runtime-target-specialization

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/runtime-target-specialization
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply target-aware runtime specialization
        run: python3 .github/runtime-target-bootstrap.py
      - name: Build and test
        run: dotnet test PB-Compiler.slnx --configuration Release
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/runtime-target-bootstrap.yml .github/runtime-target-bootstrap.py
          git config user.name "Hawkynt"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "+ specialize DOS runtime for declared x86 target"
          git push origin HEAD:feature/runtime-target-specialization
